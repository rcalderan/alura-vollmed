spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5433/vollmed_api
spring.datasource.username=postgres
spring.datasource.password=1234567

#postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#hibernate.dialect=org.hibernate.dialect.HSQLDialect

#do not auto create tables
spring.jpa.hibernate.ddl-auto=none
#set spring to avoid sql scripts like schema.sql or data.sql
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.format-sql=true

#server properties
server.error.include-stacktrace=never

#Security
api.security.jwt.secret=${JWT_SECRET}
api.security.dev.allow_all=${ALL_ROUTE_BYPASS:true}

#Need configure a GMAIL account...
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:''}
spring.mail.password=${EMAIL_PASSWORD:''}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
